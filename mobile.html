<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resetting Cache...</title>
</head>
<body>
  <h2 style="font-family: sans-serif; text-align: center; margin-top: 50px;">Fixing phone cache... please wait 5 seconds.</h2>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
        document.querySelector('h2').innerText = "Cache cleared! You can now open index.html";
        document.querySelector('h2').style.color = "green";
      }).catch(function(err) {
        document.querySelector('h2').innerText = "Error clearing cache.";
      });
    } else {
      document.querySelector('h2').innerText = "No cache found! You are good to go.";
    }
  </script>
</body>
</html>
